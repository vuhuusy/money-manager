name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.3.0"
          CLOUDFLARED_SHA256: ${{ secrets.CLOUDFLARED_SHA256 }}
        run: |
          wget -q "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb" -O cloudflared.deb
          echo "${CLOUDFLARED_SHA256}  cloudflared.deb" | sha256sum -c -
          sudo dpkg -i cloudflared.deb

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host syvhserver
            HostName ssh.syvh.io.vn
            User syvh
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Sync files to server
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='frontend/dist/' \
            . syvhserver:~/money-manager/

      - name: Deploy on server
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh syvhserver 'cd ~/money-manager && docker compose up -d --build'
